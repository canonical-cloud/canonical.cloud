name: Agent instruction hierarchy

on:
  workflow_call:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agents-hierarchy-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository under validation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Verify exact revision
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Check out immutable validator implementation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: canonical-cloud/canonical.cloud
          ref: 653d90ade730ebd966d50e48bcca7bdb63a82759
          path: .agents-validator
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v7.0.0
        with:
          python-version: "3.12"

      - name: Validate canonical files and pointers
        run: >-
          python3 .agents-validator/scripts/resolve_agents.py
          --repo-root "$GITHUB_WORKSPACE"
          --check-layout

      - name: Exercise ancestor discovery and diagnostics
        run: python3 .agents-validator/scripts/resolve_agents.py --self-test

      - name: Print repository chain from a nested directory
        run: |
          mkdir -p .agents-ci/nested/path
          python3 .agents-validator/scripts/resolve_agents.py \
            --cwd .agents-ci/nested/path \
            --print-chain
