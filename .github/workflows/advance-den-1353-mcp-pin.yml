name: Advance DEN-1353 MCP pin

on:
  push:
    branches: [sync/den-1353-mcp-hardening-pin]

permissions:
  contents: write

concurrency:
  group: den-1353-mcp-pin
  cancel-in-progress: false

jobs:
  advance:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          submodules: true
          persist-credentials: true

      - name: Advance only the verified descendant MCP gitlink
        shell: bash
        run: |
          set -Eeuo pipefail

          path=canonical-mcp-server.rs
          target=cd6b87c7459ae533040389f72243d8d9a855de98
          old=$(git ls-tree HEAD "$path" | awk '{print $3}')

          git -C "$path" fetch --no-tags origin \
            "$old" "$target" \
            +refs/heads/main:refs/remotes/origin/main
          remote_main=$(git -C "$path" rev-parse refs/remotes/origin/main)

          if [[ "$remote_main" != "$target" ]]; then
            echo "MCP remote main moved: expected $target, found $remote_main" >&2
            exit 1
          fi
          if ! git -C "$path" merge-base --is-ancestor "$old" "$target"; then
            echo "MCP target $target does not descend from current pin $old" >&2
            exit 1
          fi

          git -C "$path" checkout --detach "$target"
          git add "$path"
          git rm .github/workflows/advance-den-1353-mcp-pin.yml
          git diff --cached --check

          expected=$(printf '%s\n' \
            .github/workflows/advance-den-1353-mcp-pin.yml \
            canonical-mcp-server.rs | sort)
          actual=$(git diff --cached --name-only | sort)
          if [[ "$actual" != "$expected" ]]; then
            echo "unexpected staged paths" >&2
            diff -u <(printf '%s\n' "$expected") <(printf '%s\n' "$actual") || true
            exit 1
          fi

          mode=$(git ls-files --stage "$path" | awk '{print $1}')
          staged=$(git ls-files --stage "$path" | awk '{print $2}')
          if [[ "$mode" != "160000" || "$staged" != "$target" ]]; then
            echo "MCP path is not staged as the exact target gitlink" >&2
            exit 1
          fi

          git diff --cached --submodule=log
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Advance umbrella MCP pin to reviewed hardening"
          git push origin HEAD:sync/den-1353-mcp-hardening-pin
